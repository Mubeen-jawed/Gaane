# /etc/nginx/sites-available/gaane.revenuelyft.com
# Proxies gaane.revenuelyft.com -> Next.js on 127.0.0.1:7005.
# Certbot adds the HTTPS (443) block and redirect automatically.

# At most ~6 link imports per minute per visitor, so the server can't be
# hammered into getting its IP blocked by YouTube.
limit_req_zone $binary_remote_addr zone=gaane_import:10m rate=6r/m;
# Slow down password guessing.
limit_req_zone $binary_remote_addr zone=gaane_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gaane.revenuelyft.com;

    # Song uploads (the app itself caps files at 300 MB).
    client_max_body_size 300m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:7005;
    }

    # Next.js build assets are content-hashed: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:7005;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audio streaming: pass Range requests straight through, don't buffer.
    location ~ ^/api/songs/[a-z0-9]+/audio$ {
        proxy_pass http://127.0.0.1:7005;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Uploads can take a while on slow connections.
    location = /api/songs {
        proxy_pass http://127.0.0.1:7005;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # YouTube -> MP3 / link downloads can take a minute or two.
    location = /api/import {
        limit_req zone=gaane_import burst=5 nodelay;
        proxy_pass http://127.0.0.1:7005;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/login {
        limit_req zone=gaane_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:7005;
    }
}
